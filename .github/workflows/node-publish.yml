# Builds and publishes the Node.js package (@bars4j/core) to the public npm registry.
#
# Triggered when a GitHub release is published (aligned with the Maven workflow), when a
# `node-v*` tag is pushed, or manually.
#
# Authentication uses npm "trusted publishing" (OIDC) — no long-lived token is stored in the
# repository. The package must exist on npm with a configured trusted publisher:
#   https://www.npmjs.com/package/@bars4j/core -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization/User: ronison
#     Repository:        bars4j
#     Workflow filename: node-publish.yml
#     Environment:       (empty)
#
# The publish step uses --provenance so the release is signed with GitHub Actions build metadata.

name: Node Package

on:
  release:
    types: [published]
  push:
    tags:
      - "node-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance / trusted publishing
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; Node 22 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Type-check and test
        run: npm run check

      - name: Publish to npm
        run: npm publish --provenance --access public
