# Builds and publishes the Node.js package (@bars4j/core) to the public npm registry.
#
# Triggered when a GitHub release is published (aligned with the Maven workflow), when a
# `node-v*` tag is pushed, or manually.
#
# Authentication (pick one):
#
#   1. npm "trusted publishing" (recommended, no long-lived secret).
#      - The package must already exist on npm (register it once, or publish a placeholder with a
#        temporary token).
#      - On https://www.npmjs.com/package/@bars4j/core -> Settings -> Trusted Publisher, add a
#        GitHub Actions publisher with:
#          Organization/User: ronison
#          Repository:        bars4j
#          Workflow filename: node-publish.yml
#          Environment:       (leave empty)
#      - The workflow then authenticates via OIDC (id-token: write) with no secret configured.
#
#   2. Classic token.
#      - Add an NPM_TOKEN repository secret (an npm "Automation"/granular token with publish
#        rights for @bars4j and 2FA bypass). The workflow uses it automatically when present.
#
# The publish step uses --provenance so the release is signed with GitHub Actions build metadata.

name: Node Package

on:
  release:
    types: [published]
  push:
    tags:
      - "node-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance / trusted publishing
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and test
        run: npm run check

      # Uses the NPM_TOKEN secret when configured; otherwise falls back to npm trusted publishing
      # (OIDC), which needs no token.
      - name: Publish to npm
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "${HOME}/.npmrc"
          fi
          npm publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
