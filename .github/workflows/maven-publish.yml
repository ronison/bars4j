# This workflow will build a package using Maven and then publish it to GitHub packages when a
# release is published (not on draft creation) or when run manually.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [published]
  workflow_dispatch:

# A single release only needs one deploy; serialize runs of the same ref so two of them cannot
# race to push the same artifact version (which GitHub Packages rejects with 409 Conflict).
concurrency:
  group: maven-publish-${{ github.ref }}
  cancel-in-progress: false


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      packages: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Publish to GitHub Packages Apache Maven
      run: mvn deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}

    # Attach the built jars (main + sources) to the GitHub release so the Java library is available
    # as a downloadable asset alongside the tagged source.
    - name: Attach jars to the GitHub release
      if: github.event_name == 'release'
      run: gh release upload "${{ github.event.release.tag_name }}" target/bars4j-*.jar --clobber
      env:
        GH_TOKEN: ${{ github.token }}
